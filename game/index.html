<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e23d3d">
<meta name="description" content="二手车商模拟器：30天收车、验车、砍价。边豪出品。">
<title>二手车商模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23e23d3d' width='64' height='64' rx='12'/%3E%3Cpath fill='%23fff8ee' d='M8 40h48v6H8zM14 40l6-12h24l6 12'/%3E%3Ccircle cx='20' cy='48' r='5' fill='%23241910'/%3E%3Ccircle cx='44' cy='48' r='5' fill='%23241910'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241910;
    --paper: #fff8ee;
    --paper2: #ffe8c4;
    --red: #e23d3d;
    --red-d: #b42323;
    --gold: #f0b429;
    --green: #14845a;
    --green-d: #0d6846;
    --blue: #2c6cb0;
    --muted: #7a6a58;
    --line: #241910;
    --sus: #d06a12;
    --shadow: 4px 4px 0 var(--ink);
    --font: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
    --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: #8fd3ff;
    min-height: 100dvh;
    touch-action: manipulation;
  }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, .app:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .app {
    width: min(430px, 100%);
    margin: 0 auto;
    min-height: 100dvh;
    height: 100dvh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .scroll { flex: 1; overflow: auto; padding: 12px 12px 8px; }
  .hud {
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    background:
      radial-gradient(circle at 12% 20%, rgba(255,255,255,.35) 0 2px, transparent 3px) 0 0 / 14px 14px,
      linear-gradient(180deg, #ff5a4a, #e23d3d);
    color: white;
    border-bottom: 3px solid var(--ink);
  }
  .hud-top, .hud-bot { display: flex; align-items: center; gap: 8px; }
  .hud-top { justify-content: space-between; }
  .daypill, .iconbtn {
    background: #fff8ee;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 4px 10px;
    font-weight: 900;
    box-shadow: 2px 2px 0 #241910;
  }
  .iconbtn { padding: 4px 8px; min-width: 36px; min-height: 32px; }
  .cash { font-weight: 900; font-size: 20px; letter-spacing: .5px; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .hud-bot { margin-top: 6px; justify-content: space-between; font-size: 12px; font-weight: 700; }
  .rep { flex: 1; display: flex; align-items: center; gap: 6px; }
  .repbar { flex: 1; height: 8px; background: rgba(0,0,0,.25); border-radius: 99px; overflow: hidden; border: 1px solid rgba(0,0,0,.35); }
  .repbar > i { display: block; height: 100%; background: linear-gradient(90deg, #ffe08a, #fff); width: 0; }
  .market {
    border-radius: 999px; padding: 2px 8px; font-weight: 900; border: 2px solid var(--ink); background: #fff;
    color: var(--ink);
  }
  .market.hot { background: #ffe08a; }
  .market.cold { background: #d7ecff; }
  .limits { margin-top: 6px; font-size: 11px; font-weight: 700; opacity: .95; display: flex; gap: 8px; flex-wrap: wrap; }
  .dots { display: flex; gap: 2px; margin-top: 6px; }
  .dots i { width: 8px; height: 8px; border-radius: 2px; background: rgba(255,255,255,.35); display: block; }
  .dots i.on { background: #ffe08a; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tabs button, .btn, .choice, .dock button {
    border: 3px solid var(--ink);
    background: #fff;
    border-radius: 14px;
    box-shadow: var(--shadow);
    font-weight: 900;
    min-height: 46px;
    padding: 8px 12px;
  }
  .tabs button { flex: 1; }
  .tabs button.on { background: var(--ink); color: #fff8ee; }
  .btn { width: 100%; margin: 8px 0; font-size: 16px; }
  .btn:active, .choice:active, .tabs button:active, .car-card:active, .tool:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary, .choice.primary { background: var(--green); color: white; }
  .btn.danger { background: var(--red); color: white; }
  .btn.gold { background: var(--gold); }
  .btn.ghost, .choice.ghost { background: #fff; }
  .btn:disabled, .tool:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .car-card {
    width: 100%;
    display: grid;
    grid-template-columns: 112px 1fr auto;
    gap: 8px;
    align-items: center;
    text-align: left;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 8px;
    margin-bottom: 10px;
    position: relative;
  }
  .car-card .name { font-weight: 900; font-size: 16px; margin: 0; }
  .car-card .sub, .muted { color: var(--muted); font-size: 12px; font-weight: 700; }
  .pitch {
    margin: 4px 0 0;
    font-size: 13px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .price-tag {
    background: var(--gold);
    border: 2px solid var(--ink);
    border-radius: 8px 12px 12px 8px;
    padding: 6px 6px 6px 8px;
    font-weight: 900;
    transform: rotate(3deg);
    min-width: 64px;
    text-align: center;
  }
  .price-tag small { display: block; font-size: 10px; font-weight: 700; }
  .ribbon {
    position: absolute; top: -8px; left: 10px;
    background: var(--red); color: white; font-size: 11px; font-weight: 900;
    padding: 2px 6px; border: 2px solid var(--ink); border-radius: 6px;
  }
  .badge { display: inline-block; background: #ffe08a; border: 2px solid var(--ink); border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 900; margin-right: 4px; }
  .badge.bad { background: #ffd0d0; }
  .back {
    background: transparent; border: none; font-weight: 900; padding: 4px 0 8px; min-height: 36px; text-align: left;
  }
  .detail-head { display: grid; grid-template-columns: 140px 1fr; gap: 8px; align-items: center; }
  .display { font-family: var(--display); letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip {
    border: 2px solid var(--ink); border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 900; background: #efe6da; color: var(--muted);
  }
  .chip.ok { background: #d9f5e8; color: var(--green-d); }
  .chip.bad { background: #ffd4d4; color: var(--red-d); transform: rotate(-2deg); }
  .chip.sus { background: #ffe1c2; color: var(--sus); }
  .est {
    background: #fff; border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700;
  }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .tool {
    background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow);
    min-height: 72px; text-align: left; padding: 8px; font-weight: 900;
  }
  .tool small { display: block; color: var(--muted); font-weight: 700; }
  .tool.done { background: #e7f7ef; }
  .report {
    margin-top: 8px; background: #fffdf6; border-left: 4px solid var(--gold); padding: 6px 8px; font-size: 13px; font-weight: 700;
  }
  .buygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .buygrid .btn, .stack .btn { margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .owner {
    background: white; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 10px; margin: 8px 0;
  }
  .owner b { font-size: 13px; }
  .bubble {
    background: white; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 12px; font-weight: 700; position: relative;
  }
  .bubble:after {
    content: ""; position: absolute; left: 28px; bottom: -10px; border-width: 10px 8px 0 8px; border-style: solid; border-color: var(--ink) transparent transparent transparent;
  }
  .haggle-top { display: grid; grid-template-columns: 116px 1fr; gap: 8px; align-items: center; }
  .who { font-family: var(--display); font-size: 26px; margin: 8px 0 0; line-height: 1; }
  .prices {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 6px;
  }
  .prices div { background: white; border: 3px solid var(--ink); border-radius: 14px; padding: 8px; text-align: center; }
  .prices b { display: block; font-size: 22px; }
  .mood { font-weight: 900; text-align: center; margin: 4px 0 8px; }
  .mood.hot { color: var(--green-d); }
  .mood.warm { color: var(--sus); }
  .mood.cold { color: var(--red-d); }
  .hintline { text-align: center; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
  .lot-card { background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 10px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--ink); background: var(--gold); font-weight: 900; font-size: 20px; box-shadow: 2px 2px 0 var(--ink); }
  .asknum { font-weight: 900; min-width: 84px; text-align: center; font-size: 18px; }
  .toggles { display: flex; gap: 6px; margin: 8px 0; }
  .toggles button { flex: 1; border: 2px solid var(--ink); border-radius: 12px; background: #fff; min-height: 42px; font-weight: 900; font-size: 13px; }
  .toggles button.on { background: #d9f5e8; }
  .banner {
    border: 3px solid var(--ink); border-radius: 14px; padding: 8px 10px; background: #e7f0ff; margin-bottom: 10px; font-size: 13px; font-weight: 700;
  }
  .banner strong { display: block; font-size: 14px; }
  .mini { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .mini button { border: 2px solid var(--ink); background: #fff; border-radius: 10px; padding: 6px 8px; font-weight: 800; font-size: 12px; min-height: 36px; }
  .mini button.on { background: #d9f5e8; }
  .dock {
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, #fff8ee 28%);
  }
  .dock button { width: 100%; background: var(--ink); color: #fff8ee; }
  .modal-back {
    position: absolute; inset: 0; background: rgba(36, 25, 16, .46); z-index: 30;
    display: flex; align-items: flex-end; justify-content: center; padding: 12px;
  }
  .sheet {
    width: 100%; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow);
    padding: 14px; max-height: min(78dvh, 640px); overflow: auto;
  }
  .sheet h2, .title-block h1 { font-family: var(--display); margin: 0 0 6px; line-height: 1.15; }
  .sheet h2 { font-size: 28px; }
  .choice { width: 100%; text-align: left; margin-top: 8px; background: #fff; }
  .choice small { display: block; font-weight: 700; color: var(--muted); }
  .toast {
    position: absolute; left: 12px; right: 12px; top: 86px; z-index: 25;
    background: var(--ink); color: #fff8ee; border-radius: 12px; padding: 8px 10px; font-weight: 800; text-align: center;
  }
  .toast.bad { background: var(--red-d); }
  .title-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18px 16px 24px;
    text-align: center;
  }
  .marquee {
    background: var(--red); color: white; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 8px 8px;
    box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .marquee .bulb { font-family: var(--display); font-size: 22px; letter-spacing: 2px; }
  .title-block h1 { font-size: 40px; }
  .subtitle { font-weight: 700; color: var(--muted); margin: 0 0 12px; }
  .credit { margin-top: 14px; font-weight: 900; }
  .slogan { color: var(--red-d); font-weight: 900; letter-spacing: 1px; }
  .help p { font-size: 14px; line-height: 1.5; margin: 8px 0; }
  .summary { background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); }
  .summary li { margin: 6px 0; font-weight: 700; }
  .result-card {
    position: relative;
    background:
      radial-gradient(circle at 90% 8%, rgba(240,180,41,.45), transparent 28%),
      linear-gradient(180deg, #fffdf8, #ffe7c2);
    border: 3px solid var(--ink);
    border-radius: 20px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 18px 14px 14px;
    overflow: hidden;
  }
  .result-card:before {
    content: "";
    position: absolute; inset: 7px;
    border: 2px solid rgba(226,61,61,.85);
    border-radius: 14px;
    pointer-events: none;
  }
  .result-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
  .kicker { font-size: 12px; font-weight: 900; letter-spacing: 1px; }
  .seal {
    width: 74px; height: 74px; border: 4px solid var(--red); color: var(--red); border-radius: 50%;
    display: grid; place-items: center; font-family: var(--display); font-size: 34px; transform: rotate(-14deg);
    background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 3px rgba(226,61,61,.25);
  }
  .result-card h2 { font-family: var(--display); font-size: 40px; margin: 8px 0 4px; position: relative; }
  .stars { color: var(--red); letter-spacing: 3px; font-size: 18px; position: relative; }
  .blurb { font-weight: 800; line-height: 1.45; margin: 8px 0; position: relative; }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; }
  .statgrid div { background: rgba(255,255,255,.72); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 8px; }
  .statgrid b { display: block; font-size: 20px; }
  .statgrid span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .profit-plus { color: var(--green-d); }
  .profit-minus { color: var(--red-d); }
  .barcode {
    height: 26px; margin-top: 10px; position: relative;
    background: repeating-linear-gradient(90deg, #241910 0 2px, transparent 2px 4px, #241910 4px 7px, transparent 7px 9px, #241910 9px 10px, transparent 10px 14px);
  }
  .card-foot { display: flex; justify-content: space-between; align-items: end; margin-top: 8px; font-weight: 900; position: relative; font-size: 13px; }
  .empty { text-align: center; padding: 24px 8px; font-weight: 800; }
  .logline { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 8px; }
  @media (min-width: 860px) {
    body {
      display: flex; align-items: center; justify-content: center;
      background:
        linear-gradient(#8fd3ff, #ffe7a8 52%, #6f7d52 52% 60%, #3c4450 60%);
      min-height: 100dvh;
    }
    .app {
      width: 400px;
      height: min(900px, calc(100dvh - 28px));
      min-height: 0;
      border: 4px solid var(--ink);
      border-radius: 28px;
      box-shadow: 12px 16px 0 var(--ink);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app" class="app" aria-live="polite">
  <p style="padding:24px;font-weight:800">车行开门中…</p>
</div>
<noscript><p style="padding:24px">这游戏要开着 JavaScript 才能收车。</p></noscript>
<script src="./engine.js"></script>
<script src="./ui.js"></script>
</body>
</html>
