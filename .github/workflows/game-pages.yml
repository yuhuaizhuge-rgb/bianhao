# Deploys only the static game/ folder to GitHub Pages.
# Enable Pages → Build and deployment → GitHub Actions in the repo settings
# for this workflow to publish. It does not change those settings itself.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/game-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
